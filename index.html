<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小丑牌复刻 · 最小可玩版</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a24; color: #eee;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      min-height: 100vh; padding: 12px;
      user-select: none;
    }
    #app { max-width: 900px; margin: 0 auto; }
    /* 顶栏 */
    #hud {
      display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
      background: #26263a; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px;
      font-size: 14px;
    }
    #hud .stat { display: flex; flex-direction: column; align-items: center; min-width: 60px; }
    #hud .stat b { font-size: 17px; color: #ffd866; }
    #hud .stat span { font-size: 11px; color: #999; }
    #blindInfo { font-size: 15px; font-weight: 600; }
    #blindInfo .req { color: #ff6e6e; }
    /* 小丑区 */
    #jokers { display: flex; gap: 8px; min-height: 74px; margin-bottom: 10px; flex-wrap: wrap; }
    .joker-card {
      width: 92px; padding: 6px; border-radius: 8px; cursor: pointer;
      background: #3a2f55; border: 2px solid #5d4a8a; font-size: 11px;
      position: relative;
    }
    .joker-card .jname { font-weight: 700; font-size: 12px; margin-bottom: 3px; }
    .joker-card .jdesc { color: #c9c2e0; line-height: 1.35; }
    .joker-card.rare { background: #4a2f2f; border-color: #a85c5c; }
    .joker-card.uncommon { background: #2f4a3a; border-color: #5ca883; }
    .joker-card .sell { color: #ffd866; font-size: 10px; margin-top: 4px; }
    /* 计分板 */
    #scoreboard {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: #0d1b3d; border: 2px solid #2a4a8a; border-radius: 10px;
      padding: 8px; margin-bottom: 10px; font-size: 22px; font-weight: 700;
    }
    #scoreboard .chips { color: #6ecbff; }
    #scoreboard .mult { color: #ff6e6e; }
    #scoreboard .eq { color: #999; font-size: 16px; }
    #scoreboard .score { color: #ffd866; }
    /* 手牌 */
    #hand { display: flex; gap: 8px; justify-content: center; min-height: 120px; margin-bottom: 12px; flex-wrap: wrap; }
    .card {
      width: 74px; height: 104px; border-radius: 8px; cursor: pointer;
      background: #f5f0e6; color: #222; border: 3px solid transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 800; position: relative;
      transition: transform .12s;
    }
    .card.sel { transform: translateY(-16px); border-color: #ffd866; box-shadow: 0 0 14px #ffd86688; }
    .card .suit { font-size: 30px; }
    .card.red { color: #d33; }
    .card.black { color: #223; }
    .card .tag { position: absolute; top: 3px; right: 5px; font-size: 10px; font-weight: 700; }
    .card .enh { position: absolute; bottom: 3px; font-size: 10px; font-weight: 700; }
    .enh-bonus .tag, .enh-bonus .enh { color: #2a6edb; }
    .enh-mult .tag, .enh-mult .enh { color: #d33; }
    .enh-glass { background: #dff2ff; }
    .enh-steel { background: #cfcfd8; }
    .enh-gold { background: #ffe9a8; }
    .enh-lucky { background: #e2ffd9; }
    .enh-stone { background: #8a8a8a; color: #fff; }
    /* 按钮 */
    #actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
    button {
      font: inherit; font-weight: 700; padding: 10px 22px; border-radius: 8px;
      border: none; cursor: pointer; background: #2a4a8a; color: #fff;
    }
    button:hover:not(:disabled) { filter: brightness(1.2); }
    button:disabled { opacity: .35; cursor: default; }
    #playBtn { background: #1d7a3f; }
    #discardBtn { background: #a83232; }
    /* 消息/商店 */
    #msg {
      background: #26263a; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px;
      font-size: 13px; line-height: 1.6; max-height: 150px; overflow-y: auto; white-space: pre-wrap;
    }
    #shop { background: #26263a; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    #shop h3 { margin-bottom: 8px; font-size: 15px; }
    #shopRow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .shop-item { width: 120px; }
    .shop-item .price { color: #ffd866; font-size: 12px; margin-top: 4px; }
    #overlay {
      position: fixed; inset: 0; background: #0009; display: flex;
      align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    }
    #overlay h1 { font-size: 28px; }
    #overlay .sub { color: #bbb; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <div class="stat"><b id="money">$4</b><span>金钱</span></div>
      <div class="stat"><b id="ante">1</b><span>底注</span></div>
      <div id="blindInfo">小盲注 需求 <span class="req">100</span></div>
      <div class="stat"><b id="roundScore">0</b><span>本轮分数</span></div>
      <div class="stat"><b id="hands">4</b><span>出牌</span></div>
      <div class="stat"><b id="discards">3</b><span>弃牌</span></div>
      <div class="stat"><b id="handSize">8</b><span>手牌上限</span></div>
      <div class="stat"><b id="seedTag">SEED</b><span>种子</span></div>
      <button id="helpBtn" title="游戏教程" style="padding:6px 14px;font-size:13px;">📖 教程</button>
    </div>
    <div id="jokers"></div>
    <div id="scoreboard"><span class="chips" id="sbChips">0</span><span class="eq">×</span><span class="mult" id="sbMult">0</span><span class="eq">=</span><span class="score" id="sbScore">0</span></div>
    <div id="hand"></div>
    <div id="actions">
      <button id="playBtn">出牌</button>
      <button id="discardBtn">弃牌</button>
      <button id="cashBtn" class="hidden">结算 💰</button>
    </div>
    <div id="msg">点击手牌选择（最多 5 张），出牌计分。</div>
    <div id="shop" class="hidden">
      <h3>商店</h3>
      <div id="shopRow"></div>
      <button id="rerollBtn">重掷 $5</button>
      <button id="nextBlindBtn">下一盲注 ▶</button>
    </div>
  </div>
  <div id="overlay" class="hidden">
    <h1 id="overTitle"></h1>
    <div class="sub" id="overSub"></div>
    <button id="restartBtn">再来一局</button>
  </div>
  <script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
